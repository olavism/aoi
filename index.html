<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="aoi">
<title>aoi — cashflow ledger</title>
<style>
  :root{
    color-scheme: dark;
    /* palette: #7fff00 income · #111111 base · #ff2e63 expense · #f9f871 pending · cyan accent */
    --bg: oklch(17.6% 0.004 230);
    --surface: oklch(20% 0.005 230);
    --raised: oklch(24% 0.006 230);
    --sunken: oklch(14.5% 0.004 230);
    --ink: oklch(93% 0.004 230);
    --muted: oklch(68% 0.008 230);
    --faint: oklch(50% 0.008 230);
    --line: oklch(30.5% 0.008 230);
    --line-soft: oklch(25% 0.006 230);
    --accent: oklch(79% 0.125 200);
    --accent-deep: oklch(68% 0.12 200);
    --accent-tint: oklch(79% 0.125 200 / .12);
    --income: oklch(89% 0.27 134);
    --income-glow: oklch(89% 0.27 134 / .3);
    --income-tint: oklch(89% 0.27 134 / .11);
    --expense: oklch(64% 0.235 16);
    --expense-glow: oklch(64% 0.235 16 / .35);
    --expense-tint: oklch(64% 0.235 16 / .13);
    --pending: oklch(95% 0.17 109);
    --pending-glow: oklch(95% 0.17 109 / .3);
    --pending-tint: oklch(95% 0.17 109 / .11);
    --focus: oklch(79% 0.125 200 / .3);
    font-size: 16px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    background:
      radial-gradient(60rem 28rem at 85% -8rem, oklch(30% 0.05 200 / .22), transparent 65%),
      radial-gradient(50rem 26rem at -10% -6rem, oklch(34% 0.08 134 / .13), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size:.875rem; line-height:1.45;
    -webkit-font-smoothing:antialiased;
    min-height:100dvh;
  }
  .num{ font-variant-numeric: tabular-nums; }

  /* ---------- motion ---------- */
  @keyframes rise{ from{ opacity:0; transform:translateY(7px); } to{ opacity:1; transform:none; } }
  main.anim{ animation:rise .28s cubic-bezier(.16,1,.3,1); }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

  /* graph entrance: lines draw themselves in, glow and area fade up after */
  .chart-wrap svg .ln{ stroke-dasharray:1; transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1) .1s; }
  .chart-wrap.see:not(.go) svg .ln{ stroke-dashoffset:1; }
  .chart-wrap svg :is(.ar,.lnglow){ transition:opacity .9s ease-out .7s; }
  .chart-wrap.see:not(.go) svg :is(.ar,.lnglow){ opacity:0; }
  .hbars .fill{ transition:width .85s cubic-bezier(.22,1,.36,1); }
  .hbars.see:not(.go) .fill{ width:0 !important; }

  /* sync status */
  .dot{ display:inline-block; width:.4rem; height:.4rem; border-radius:50%; margin-right:.4rem; vertical-align:1px; }
  .dot.ok{ background:var(--income); box-shadow:0 0 7px var(--income-glow); }
  .dot.err{ background:var(--expense); box-shadow:0 0 7px var(--expense-glow); }
  .dot.sync{ background:var(--pending); animation:pulse 1.1s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation:none !important; transition:none !important; }
  }

  /* ---------- shell ---------- */
  header.top{
    display:flex; align-items:center; gap:2rem;
    padding:env(safe-area-inset-top, 0px) 2rem 0;
    height:calc(3.4rem + env(safe-area-inset-top, 0px));
    border-bottom:1px solid var(--line-soft);
    background:oklch(18% 0.004 230 / .82);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    position:sticky; top:0; z-index:20;
  }
  /* baseline alignment puts the dot exactly where a period sits */
  .brand{ font-weight:700; font-size:1.05rem; letter-spacing:-.03em; display:flex; align-items:baseline; }
  .brand i{ width:.3rem; height:.3rem; border-radius:50%; background:var(--income);
            box-shadow:0 0 8px var(--income-glow), 0 0 18px var(--income-glow);
            margin:0 .6rem 0 .14rem; }
  .brand small{ font-weight:450; color:var(--muted); font-size:.75rem; letter-spacing:.02em; }

  /* first-run welcome */
  #firstrun{
    position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center;
    padding:2rem;
    background:
      radial-gradient(60rem 28rem at 85% -8rem, oklch(30% 0.05 200 / .22), transparent 65%),
      radial-gradient(50rem 26rem at -10% -6rem, oklch(34% 0.08 134 / .13), transparent 60%),
      var(--bg);
  }
  #firstrun[hidden]{ display:none; }
  .fr-inner[hidden]{ display:none; }
  .fr-inner{ display:flex; flex-direction:column; align-items:center; gap:.7rem;
             width:min(19rem,100%); text-align:center; animation:rise .4s cubic-bezier(.16,1,.3,1); }
  .fr-inner .s-mark{ margin-bottom:.3rem; }
  .fr-tag{ color:var(--muted); font-size:.875rem; line-height:1.65; margin:0 0 1.3rem; }
  .fr-btn{ width:100%; padding:.72rem; font-size:.9rem; }

  /* empty states */
  .empty-hero{ display:flex; flex-direction:column; align-items:center; gap:1rem;
               padding:3rem 1.25rem; color:var(--muted); text-align:center;
               border:1px dashed var(--line); border-radius:12px; }
  .empty-hero p{ margin:0; }

  /* editor validation */
  @keyframes shake{ 20%{ transform:translateX(-4px); } 40%{ transform:translateX(4px); }
                    60%{ transform:translateX(-3px); } 80%{ transform:translateX(2px); } }
  .err{ border-color:var(--expense) !important; }
  .shake{ animation:shake .32s ease-out; }

  /* launch splash */
  #splash{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
           background:var(--bg); transition:opacity .45s ease-out; }
  #splash.done{ opacity:0; pointer-events:none; }
  .s-mark{ font-size:3.2rem; font-weight:700; letter-spacing:-.05em; color:var(--ink); display:flex; align-items:baseline; }
  .s-mark i{ width:.58rem; height:.58rem; border-radius:50%; background:var(--income);
             box-shadow:0 0 18px var(--income-glow), 0 0 44px var(--income-glow);
             margin-left:.26rem;
             animation:pulse 1.2s ease-in-out infinite; }
  /* floating liquid-glass nav */
  nav.tabs{
    position:fixed; top:.5rem; left:50%; transform:translateX(-50%);
    z-index:29; display:flex; gap:.15rem; padding:.3rem;
    border-radius:999px;
    background:linear-gradient(135deg, oklch(55% 0.012 230 / .14), oklch(25% 0.008 230 / .3));
    backdrop-filter:blur(22px) saturate(170%); -webkit-backdrop-filter:blur(22px) saturate(170%);
    border:1px solid oklch(98% 0 0 / .12);
    box-shadow:0 10px 36px oklch(0% 0 0 / .45),
               inset 0 1px 0 oklch(100% 0 0 / .14),
               inset 0 -1px 0 oklch(0% 0 0 / .25);
    /* applies when re-appearing: quick, eager ease-out */
    transition:transform .34s cubic-bezier(.22,1,.36,1), opacity .26s ease-out;
  }
  nav.tabs.hide{
    transform:translateX(-50%) translateY(calc(-100% - 1.25rem));
    opacity:0; pointer-events:none;
    /* applies when hiding: longer, gentle ease-in-out glide */
    transition:transform .55s cubic-bezier(.45,.05,.35,1), opacity .45s cubic-bezier(.45,.05,.55,.95);
  }
  nav.tabs .blob{
    position:absolute; border-radius:999px;
    background:oklch(100% 0 0 / .12);
    box-shadow:inset 0 1px 0 oklch(100% 0 0 / .2), 0 2px 10px oklch(0% 0 0 / .3);
    transition:left .32s cubic-bezier(.22,1,.36,1), width .32s cubic-bezier(.22,1,.36,1),
               top .32s cubic-bezier(.22,1,.36,1), height .32s cubic-bezier(.22,1,.36,1);
  }
  nav.tabs button{
    position:relative; z-index:1;
    appearance:none; border:0; background:none; cursor:pointer;
    font:inherit; font-size:.8125rem; color:var(--muted);
    padding:.45rem 1rem; border-radius:999px;
    display:flex; align-items:center; gap:.45rem;
    transition:color .18s ease-out;
  }
  nav.tabs button svg{ width:15px; height:15px; flex:none; }
  nav.tabs button:hover{ color:var(--ink); }
  nav.tabs button.on{ color:var(--accent); font-weight:550; }
  nav.tabs button.on svg{ filter:drop-shadow(0 0 5px var(--focus)); }
  nav.tabs button.nudge::after{
    content:''; position:absolute; top:.4rem; right:.5rem;
    width:.38rem; height:.38rem; border-radius:50%;
    background:var(--pending); box-shadow:0 0 8px var(--pending-tint);
  }
  nav.tabs .fab{
    appearance:none; border:0; cursor:pointer; flex:0 0 auto;
    width:2.5rem; height:2.5rem; border-radius:50%; align-self:center;
    background:var(--accent); color:oklch(15% 0.005 230);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 16px -4px var(--accent);
    margin:0 .3rem; padding:0;
    transition:transform .15s ease-out, box-shadow .2s ease-out;
  }
  nav.tabs .fab:hover{ box-shadow:0 0 24px -4px var(--accent); }
  nav.tabs .fab:active{ transform:scale(.92); }
  nav.tabs .fab svg{ width:17px; height:17px; }
  header.top .right{ margin-left:auto; display:flex; align-items:center; gap:.75rem; color:var(--faint); font-size:.75rem; }

  main{ max-width:1160px; margin:0 auto; padding:1.75rem 2rem 5rem; }

  h2{ font-size:1rem; font-weight:600; letter-spacing:-.01em; margin:0 0 1rem; }
  .sub{ color:var(--muted); font-size:.8125rem; }
  .scroll-x{ overflow-x:auto; }

  /* ---------- stat strip ---------- */
  .strip{
    display:grid; grid-template-columns:repeat(6,1fr);
    border:1px solid var(--line-soft); border-radius:10px;
    margin-bottom:2.25rem;
    background:linear-gradient(180deg, var(--raised), var(--surface));
    overflow:hidden;
  }
  .strip > div{ padding:1rem 1.25rem 1.1rem; }
  .strip > div + div{ border-left:1px solid var(--line-soft); }
  .strip .lbl{ font-size:.6875rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:.4rem; }
  .strip .val{ font-size:1.375rem; font-weight:600; letter-spacing:-.02em; }
  .strip .val.pos{ color:var(--income); text-shadow:0 0 16px var(--income-glow); }
  .strip .val.neg{ color:var(--expense); text-shadow:0 0 16px var(--expense-glow); }
  .strip .val.pend{ color:var(--pending); text-shadow:0 0 16px var(--pending-glow); }
  .strip .note{ font-size:.71875rem; color:var(--faint); margin-top:.25rem; }
  .delta{ font-weight:650; }
  .delta.up{ color:var(--income); }
  .delta.down{ color:var(--expense); }

  /* ---------- overview grid ---------- */
  .ov-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:2.5rem 3rem; }
  .ov-grid .wide{ grid-column:1 / -1; }
  section{ min-width:0; }

  /* chart */
  .chart-wrap svg{ display:block; width:100%; height:auto; }
  .chart-wrap .bar-in{ fill:var(--income); filter:drop-shadow(0 0 4px var(--income-glow)); }
  .chart-wrap .bar-pn{ fill:var(--pending); }
  .chart-wrap .bar-ex{ fill:var(--expense); filter:drop-shadow(0 0 4px var(--expense-glow)); }
  .chart-wrap .net-line{ stroke:var(--accent); filter:drop-shadow(0 0 4px var(--focus)); }
  .chart-wrap .net-dot{ fill:var(--accent); }
  .legend{ display:flex; gap:1.25rem; font-size:.71875rem; color:var(--muted); margin-bottom:.6rem; flex-wrap:wrap; }
  .legend i{ display:inline-block; width:.6rem; height:.6rem; border-radius:2px; margin-right:.4rem; vertical-align:-1px; }

  /* hbar lists */
  .hbars{ display:flex; flex-direction:column; gap:.55rem; }
  .hbar{ display:grid; grid-template-columns: 9.5rem 1fr 6rem; gap:.75rem; align-items:center; font-size:.8125rem; }
  .hbar .name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
  .hbar .track{ height:.5rem; background:var(--sunken); border-radius:99px; overflow:hidden; }
  .hbar .fill{ display:block; height:100%; border-radius:99px;
               box-shadow:0 0 9px -1px currentColor; }
  .hbar .amt{ text-align:right; color:var(--muted); }

  /* tables */
  table{ width:100%; border-collapse:collapse; font-size:.8125rem; }
  th{ text-align:left; font-size:.6875rem; text-transform:uppercase; letter-spacing:.07em;
      color:var(--muted); font-weight:550; padding:.45rem .65rem; border-bottom:1px solid var(--line); white-space:nowrap; }
  td{ padding:.5rem .65rem; border-bottom:1px solid var(--line-soft); vertical-align:middle; }
  th.r, td.r{ text-align:right; }
  tr.total td{ border-top:1px solid var(--line); border-bottom:0; font-weight:600; }
  .pos{ color:var(--income); } .neg{ color:var(--expense); }

  /* upcoming list */
  .up-list{ display:flex; flex-direction:column; }
  .up-row{ display:grid; grid-template-columns:4.5rem 1fr auto auto; gap:.9rem; align-items:baseline;
           padding:.5rem 0; border-bottom:1px solid var(--line-soft); font-size:.8125rem; }
  .up-row .d{ color:var(--muted); font-size:.75rem; }
  .up-row .amt{ font-weight:550; text-align:right; min-width:6.5rem; }
  .empty{ color:var(--faint); font-size:.8125rem; padding:1rem 0; }

  /* chips */
  .chip{ display:inline-block; font-size:.6875rem; font-weight:550; padding:.12rem .55rem .14rem; border-radius:999px; white-space:nowrap; }
  .chip.received{ background:var(--income-tint); color:var(--income); box-shadow:inset 0 0 0 1px oklch(89% 0.27 134 / .28); }
  .chip.incoming{ background:var(--pending-tint); color:var(--pending); box-shadow:inset 0 0 0 1px oklch(95% 0.17 109 / .28); }
  .chip.paid{ background:var(--raised); color:var(--muted); box-shadow:inset 0 0 0 1px var(--line-soft); }
  .chip.due{ background:var(--expense-tint); color:var(--expense); box-shadow:inset 0 0 0 1px oklch(64% 0.235 16 / .3); }
  .rec{ color:var(--faint); font-size:.75rem; margin-left:.35rem; }

  /* ---------- toolbar / controls ---------- */
  .toolbar{ display:flex; flex-wrap:wrap; gap:.5rem; align-items:center; margin-bottom:1rem; }
  .toolbar .grow{ flex:1; }
  input[type=text], input[type=search], input[type=number], input[type=date], select, textarea{
    font:inherit; color:var(--ink); background:var(--sunken);
    border:1px solid var(--line); border-radius:8px;
    padding:.45rem .65rem; outline:none; min-width:0;
    transition:border-color .15s ease-out, box-shadow .2s ease-out;
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible{ border-color:var(--accent); box-shadow:0 0 0 3px var(--focus), 0 0 14px var(--focus); }
  select{ padding-right:1.6rem; }
  input[type=search]{ width:14rem; }
  ::placeholder{ color:var(--faint); text-transform:none; }

  .btn{
    font:inherit; font-weight:550; cursor:pointer; border-radius:8px;
    padding:.45rem .9rem; border:1px solid var(--line);
    background:var(--raised); color:var(--ink);
    transition:background .15s ease-out, border-color .15s ease-out, box-shadow .2s ease-out, transform .12s ease-out;
    text-decoration:none; display:inline-block; text-align:center;
  }
  .btn:hover{ background:var(--line-soft); border-color:var(--line); }
  .btn:active{ transform:scale(.97); }
  .btn:focus-visible{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--focus); }
  .btn.primary{
    background:var(--accent); border-color:var(--accent); color:oklch(15% 0.005 230);
    box-shadow:0 0 16px -4px var(--accent);
  }
  .btn.primary:hover{ background:oklch(85% 0.12 200); box-shadow:0 0 22px -4px var(--accent); }
  .btn.danger{ color:var(--expense); }
  .btn.danger:hover{ background:var(--expense-tint); border-color:oklch(64% 0.235 16 / .35); }
  .btn:disabled{ opacity:.45; cursor:default; }

  /* transactions table */
  .tx-scroll{ overflow-x:auto; border-top:1px solid var(--line); }
  .tx-table tbody tr{ cursor:pointer; }
  .tx-table tbody tr td{ transition:background .15s ease-out; }
  .tx-table tbody tr:hover td{ background:var(--surface); }
  .tx-table .desc{ font-weight:520; }
  .tx-table .meta{ color:var(--muted); font-size:.75rem; }
  td .fx{ color:var(--faint); font-size:.71875rem; display:block; }

  /* ---------- slide-over panel ---------- */
  #backdrop{ position:fixed; inset:0; background:oklch(8% 0.004 230 / .55); opacity:0; pointer-events:none;
             transition:opacity .18s ease-out; z-index:30; backdrop-filter:blur(2px); -webkit-backdrop-filter:blur(2px); }
  #backdrop.show{ opacity:1; pointer-events:auto; }
  #panel{
    position:fixed; top:0; right:0; bottom:0; width:25.5rem; max-width:100vw;
    background:var(--surface); border-left:1px solid var(--line);
    transform:translateX(102%);
    transition:transform .24s cubic-bezier(.16,1,.3,1), background .4s ease-out;
    z-index:31; display:flex; flex-direction:column;
    box-shadow:-20px 0 60px oklch(5% 0.004 230 / .5);
  }
  /* ambient mode: the whole sheet shifts color with the transaction type */
  #panel.exp{
    background:
      radial-gradient(30rem 18rem at 50% -5rem, oklch(38% 0.13 15 / .35), transparent 70%),
      var(--surface);
  }
  #panel.inc{
    background:
      radial-gradient(30rem 18rem at 50% -5rem, oklch(40% 0.1 145 / .22), transparent 70%),
      var(--surface);
  }
  #panel.exp .seg button.on{ background:var(--expense-tint); color:var(--expense); }
  #panel.inc .seg button.on{ background:var(--income-tint); color:var(--income); }
  #panel.exp :is(input,select,textarea):focus-visible{
    border-color:var(--expense); box-shadow:0 0 0 3px var(--expense-glow), 0 0 14px var(--expense-glow); }
  #panel.inc :is(input,select,textarea):focus-visible{
    border-color:var(--income); box-shadow:0 0 0 3px oklch(89% 0.27 134 / .25), 0 0 14px var(--income-glow); }
  #panel.exp .p-foot .btn.primary{
    background:var(--expense); border-color:var(--expense); color:oklch(97% 0.005 230);
    box-shadow:0 0 16px -4px var(--expense); }
  #panel.exp .p-foot .btn.primary:hover{ background:oklch(72% 0.21 15); }
  #panel.inc .p-foot .btn.primary{
    background:var(--income); border-color:var(--income); color:oklch(15% 0.005 230);
    box-shadow:0 0 16px -4px var(--income); }
  #panel.inc .p-foot .btn.primary:hover{ background:oklch(93% 0.25 134); }
  #panel.exp .php-preview b{ color:var(--expense); }
  #panel.inc .php-preview b{ color:var(--income); }
  #panel.show{ transform:translateX(0); }
  #panel .p-head{ display:flex; align-items:center; justify-content:space-between; padding:1rem 1.5rem; border-bottom:1px solid var(--line-soft); }
  #panel .p-head h2{ margin:0; }
  #panel .p-body{ padding:1.25rem 1.5rem; overflow-y:auto; flex:1; }
  #panel .p-foot{ display:flex; gap:.6rem; padding:1rem 1.5rem calc(1rem + env(safe-area-inset-bottom)); border-top:1px solid var(--line-soft); }
  #panel .p-foot .spacer{ flex:1; }
  .x{ appearance:none; border:0; background:none; cursor:pointer; font-size:1.1rem; color:var(--muted); padding:.25rem .45rem; border-radius:7px;
      transition:background .15s ease-out, color .15s ease-out; }
  .x:hover{ background:var(--raised); color:var(--ink); }
  .del-x{ font-size:1.15rem; padding:.35rem .65rem; color:var(--faint); }
  .del-x:hover{ background:var(--expense-tint); color:var(--expense); }

  .field{ margin-bottom:.9rem; }
  .ac-wrap{ position:relative; }
  #ac{ position:absolute; left:0; right:0; top:calc(100% + .3rem); z-index:10;
       background:oklch(21% 0.008 230 / .98); border:1px solid var(--line); border-radius:10px;
       box-shadow:0 14px 34px oklch(0% 0 0 / .5); max-height:13rem; overflow-y:auto; }
  #ac[hidden]{ display:none; }
  .ac-item{ padding:.55rem .75rem; cursor:pointer; display:flex; justify-content:space-between;
            align-items:baseline; gap:.75rem; font-size:.8125rem; color:var(--ink); }
  .ac-item + .ac-item{ border-top:1px solid var(--line-soft); }
  .ac-item:hover{ background:var(--raised); }
  .ac-item .m{ color:var(--faint); font-size:.71875rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .field label{ display:block; font-size:.71875rem; font-weight:550; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:.3rem; }
  .field input, .field select, .field textarea{ width:100%; }
  /* minmax(0,…) lets the native date input shrink instead of overflowing its column */
  .row2{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:.75rem; }
  .field input[type=date]{ -webkit-appearance:none; appearance:none; min-width:0; min-height:2.3rem; }
  .seg{ display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--sunken); }
  .seg button{ flex:1; font:inherit; border:0; background:none; color:var(--muted); padding:.45rem 0; cursor:pointer;
               transition:background .15s ease-out, color .15s ease-out; }
  .seg button + button{ border-left:1px solid var(--line); }
  .seg button.on{ background:var(--accent-tint); color:var(--accent); font-weight:570; }
  .php-preview{ background:var(--sunken); border:1px solid var(--line-soft); border-radius:8px; padding:.6rem .8rem; font-size:.8125rem; color:var(--muted); display:flex; justify-content:space-between; }

    .tx-table tbody tr[data-action]::before,

    .tx-table tbody tr[data-action]::before{
      content:attr(data-action); left:0; justify-content:flex-start; padding-left:1rem;
      background:var(--income-tint); color:var(--income);
    }
    .tx-table tbody tr[data-action]::after{
      content:'Delete'; right:0; justify-content:flex-end; padding-right:1rem;

    .tx-table tbody tr.swipe-r::before{ opacity:1; }

    .tx-table tbody tr.commit.swipe-r::before{ background:var(--income); color:oklch(15% 0.005 230); }
    .tx-table tbody tr.commit.swipe-l::after{ background:var(--expense); color:oklch(97% 0.005 230); }
    /* reverting (Received → Incoming, Paid → Due) reads as pending, not confirm */
    .tx-table tbody tr[data-revert]::before{ background:var(--pending-tint); color:var(--pending); }
    .tx-table tbody tr.commit.swipe-r[data-revert]::before{ background:var(--pending); color:oklch(15% 0.005 230); }

    .tx-table td:nth-child(3){ grid-row:3; grid-column:1; font-size:.72rem; color:var(--muted); }
    .tx-table td:nth-child(6){ grid-row:3; grid-column:2; text-align:right; font-size:.72rem; color:var(--muted); }
    .tx-table td:nth-child(4){ display:none; }
    .tx-table td.php-same{ visibility:hidden; }
    td .fx{ display:inline; margin-left:.3rem; }

    .inv-table input{ width:100%; }
    .inv-table input.aname{ width:100%; }
    .hbar{ grid-template-columns:7rem 1fr 5.5rem; gap:.5rem; }

    /* editor becomes a bottom sheet */
    #panel{
      top:auto; bottom:0; left:0; right:0; width:100%;
      max-height:calc(100dvh - 3rem);
      border-left:0; border-top:1px solid var(--line);

    /* sticky date group headers */
    .tx-table tr.ghead{ display:block; position:sticky;

    #toast{ bottom:calc(4.9rem + env(safe-area-inset-bottom)); max-width:calc(100% - 2rem); }
  }
</style>

<script>
'use strict';

const APP_VERSION = '1.6.0 · 2026-06-12';

/* ============================== starting data ============================== */

const RATES = { PHP:1, USD:61.2520, GBP:82.0231, USDT:61.2520 };

const DEFAULT_CATEGORIES = ['Salary','Retainer','Project','Other Income',
  'Food & Drinks','Transport','Utilities','Subscription','Shopping',
  'Rent / Mortgage','Credit card','Other Expense'];

function buildFresh(){
  return {
    v: 1, tx: [], nextId: 1, assets: [],
    rates: { PHP:1, USD:RATES.USD, GBP:RATES.GBP },
    clients: ['N/A'],
    categories: [...DEFAULT_CATEGORIES],
  };
}

// anonymized demo ledger: three months of activity relative to today
function buildSample(){
  const s = buildFresh();
  s.clients = ['Acme Studio','Northwind Co','Side Project','N/A'];
  const now = new Date();
  const D = (mOff, day) => {
    const d = new Date(now.getFullYear(), now.getMonth()+mOff, 1);
    const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(Math.min(day,last)).padStart(2,'0');
  };
  const rows = [];
  for(let m=-2; m<=0; m++){
    rows.push(
      [D(m,5),'Income', m===0?'Incoming':'Received','Acme Studio retainer','Acme Studio','Retainer','USD',900,1],
      [D(m,12),'Income','Received','Northwind project','Northwind Co','Project','PHP',25000,0],
      [D(m,1),'Expense','Paid','Rent','N/A','Rent / Mortgage','PHP',15000,1],
      [D(m,3),'Expense','Paid','Electricity','N/A','Utilities','PHP',2800,1],
      [D(m,8),'Expense','Paid','Groceries','N/A','Food & Drinks','PHP',6500,0],
      [D(m,15),'Expense', m===0?'Due':'Paid','Streaming subscriptions','N/A','Subscription','PHP',950,1],
      [D(m,20),'Expense','Paid','Fuel','N/A','Transport','PHP',2200,0],
    );
  }
  rows.push([D(0,25),'Income','Incoming','Side project milestone','Side Project','Project','USD',350,0]);
  rows.push([D(0,28),'Expense','Due','Credit card payment','N/A','Credit card','PHP',12000,0]);
  let id = 1;
  s.tx = rows.map(r => ({ id:id++, date:r[0], type:r[1], status:r[2], desc:r[3],
    client:r[4], category:r[5], currency:r[6], amount:r[7],
    rate:RATES[r[6]] ?? 1, recurring:!!r[8], notes:'' }));
  s.nextId = id;
  s.assets = [ { name:'USDT', qty:500, rate:RATES.USDT }, { name:'BTC', qty:0.004, rate:3800000 } ];
  s.rates.USDT = RATES.USDT;
  return s;
}

/* ============================== state ============================== */

const KEY = 'aoi-state-v1';
let S = null, firstRun = false;
try {
  // fall back to the pre-rename key so existing installs keep their data
  const raw = localStorage.getItem(KEY) ?? localStorage.getItem('kita-state-v1');
  if(raw) S = JSON.parse(raw);
} catch {}
if(!S){ S = buildFresh(); firstRun = true; }
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch{} }
function save(){ S.metaU = Date.now(); persist(); scheduleCloudPush(); }

/* ids: legacy entries are numeric; everything new gets a collision-free string id */
const sameId = (a,b) => String(a) === String(b);
function genId(){ return 'tx' + Date.now().toString(36) + Math.floor(Math.random()*1679616).toString(36); }
function hashId(s){ let h = 5381; for(let i=0;i<s.length;i++) h = ((h<<5)+h+s.charCodeAt(i))>>>0; return 'r'+h.toString(36); }

/* swap in a new dataset (first-run choice or backup restore) and re-derive scope */
function adoptState(newS, msg){
  S = newS; firstRun = false;
  if(!S.nextId) S.nextId = S.tx.reduce((a,t)=>Math.max(a,t.id),0)+1;
  save();
  $('#firstrun')?.remove();
  const ys = yearsList(), cy = String(new Date().getFullYear());
  YEAR = ys.includes(cy) ? cy : (ys[ys.length-1] || 'all');
  F.month = '';
  const ym = todayISO().slice(0,7);
  if((YEAR==='all' || ym.startsWith(YEAR)) && S.tx.some(t=>t.date.startsWith(ym))) F.month = ym;
  render(true);
  if(msg) showToast(msg);
  haptic(12);
  syncRates();
}

const fmt0 = new Intl.NumberFormat('en-PH', { maximumFractionDigits:0 });
const fmt2 = new Intl.NumberFormat('en-PH', { minimumFractionDigits:2, maximumFractionDigits:2 });
const php0 = n => (n<0?'-₱':'₱') + fmt0.format(Math.abs(Math.round(n)));
const php2 = n => (n<0?'-₱':'₱') + fmt2.format(Math.abs(n));
const pesos = t => t.amount * t.rate;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = sel => document.querySelector(sel);

const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function monthLabel(ym){ const [y,m] = ym.split('-'); return MONTH_NAMES[+m-1] + ' ' + y; }
function dayLabel(d){ const [,m,dd] = d.split('-'); return MONTH_NAMES[+m-1] + ' ' + (+dd); }
function todayISO(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

function humanDate(iso){
  const t = todayISO();
  if(iso===t) return 'Today';
  const d = new Date(iso+'T00:00:00'), now = new Date(t+'T00:00:00');
  const diff = Math.round((d-now)/86400000);
  if(diff===-1) return 'Yesterday';
  if(diff===1) return 'Tomorrow';
  const opts = { weekday:'short', month:'short', day:'numeric' };
  if(d.getFullYear()!==now.getFullYear()){ delete opts.weekday; opts.year='numeric'; }
  return d.toLocaleDateString('en-PH', opts);
}

function groupLabel(iso){
  const t = todayISO();
  if(iso===t) return 'Today';
  const diff = Math.round((new Date(iso+'T00:00:00') - new Date(t+'T00:00:00'))/86400000);
  if(diff===-1) return 'Yesterday';
  return monthLabel(iso.slice(0,7));
}

/* ---------- haptics ----------
   Android: navigator.vibrate. iOS Safari 17.4+: clicking a hidden
   switch-style checkbox fires the system toggle haptic. */
const hapticEl = (()=>{
  const l = document.createElement('label');
  l.style.cssText = 'position:fixed;width:0;height:0;overflow:hidden;opacity:0;pointer-events:none';
  l.setAttribute('aria-hidden','true');
  const i = document.createElement('input');
  i.type = 'checkbox';
  i.setAttribute('switch','');
  i.tabIndex = -1;
  l.appendChild(i);
  document.body.appendChild(l);
  return l;
})();
function haptic(ms){
  if(navigator.vibrate){ navigator.vibrate(ms || 10); return; }
  try{ hapticEl.click(); }catch{}
}

function seriesOf(t){

  if(!t.recurring) return [t];

  return S.tx.filter(x=>x.recurring && [x.desc, x.client, x.category, x.currency, x.type].join('|')===k);

function flipStatus(id){

  const prev = t.status, prevU = t.u;
  t.status = t.type==='Income' ? (t.status==='Received'?'Incoming':'Received')
                               : (t.status==='Paid'?'Due':'Paid');
  t.u = Date.now();
  haptic(12);
  save(); render();
  showToast(`${t.desc} → ${t.status}`, ()=>{ t.status = prev; t.u = prevU; save(); });
}

async function deleteTx(id){
  const i = S.tx.findIndex(t=>sameId(t.id,id)); if(i<0) return;
  const target = S.tx[i];
  const members = seriesOf(target);
  let all = false;
  if(members.length > 1){
    const sc = await askScope(`"${target.desc}" repeats ${members.length} times. Delete…`);
    if(sc==='cancel') return;
    all = sc==='all';
  }
  const goneList = all ? members : [target];
  const goneIds = new Set(goneList.map(t=>String(t.id)));
  S.tx = S.tx.filter(t=>!goneIds.has(String(t.id)));
  S.deleted ||= {};
  goneList.forEach(t=>{ S.deleted[String(t.id)] = Date.now(); });
  haptic(16);
  save(); render();
  showToast(all ? `Deleted ${goneList.length} occurrences` : `Deleted "${target.desc}"`, ()=>{
    goneList.forEach(t=>delete S.deleted[String(t.id)]);
    S.tx.push(...goneList); save();
  });
}

/* ---------- recurring auto-roll ---------- */
// keep every recurring series one occurrence ahead of the current month
function rollRecurring(){
  const ym = todayISO().slice(0,7);
  const latest = new Map();
  for(const t of S.tx){
    if(!t.recurring) continue;
    const k = [t.desc, t.client, t.category, t.currency, t.type].join('|');
    const cur = latest.get(k);
    if(!cur || t.date > cur.date) latest.set(k, t);
  }
  let changed = false;
  const existing = new Set(S.tx.map(t=>String(t.id)));
  for(let t of latest.values()){
    const seriesKey = [t.desc, t.client, t.category, t.currency, t.type].join('|');
    let guard = 0;
    while(t.date.slice(0,7) <= ym && guard++ < 24){
      const [y,m,d] = t.date.split('-').map(Number);
      const ny = m===12 ? y+1 : y, nm = m===12 ? 1 : m+1;
      const maxD = new Date(ny, nm, 0).getDate();
      const nd = `${ny}-${String(nm).padStart(2,'0')}-${String(Math.min(d,maxD)).padStart(2,'0')}`;
      // deterministic id so every synced device generates the same occurrence once
      const rid = hashId(seriesKey + '|' + nd);
      t = { ...t, id:rid, date:nd, status: t.type==='Income' ? 'Incoming' : 'Due', u:Date.now() };
      if(!existing.has(rid) && !(S.deleted && S.deleted[rid])){
        S.tx.push(t); existing.add(rid); changed = true;
      }
    }
  }
  if(changed) save();
}

function totals(){
  let received=0, incoming=0, paid=0, due=0;
  for(const t of S.tx){
    if(!inYear(t)) continue;
    const v = pesos(t);
    if(t.type==='Income'){ t.status==='Incoming' ? incoming+=v : received+=v; }
    else { t.status==='Due' ? due+=v : paid+=v; }
  }
  const invest = S.assets.reduce((a,x)=>a + x.qty*x.rate, 0);
  const income = received + incoming;
  const expenses = paid + due;
  return { received, incoming, paid, due, invest, income, expenses,
           grand: income + invest, net: income + invest - expenses };
}

/* one bucket per month of the selected year, or per year when viewing all time */
function byPeriod(){
  const map = new Map();
  for(const t of S.tx){
    if(!inYear(t)) continue;
    const key = YEAR==='all' ? t.date.slice(0,4) : t.date.slice(0,7);
    if(!map.has(key)) map.set(key, { key, received:0, incoming:0, expenses:0 });
    const m = map.get(key), v = pesos(t);
    if(t.type==='Income'){ t.status==='Incoming' ? m.incoming+=v : m.received+=v; }
    else m.expenses += v;
  }
  return [...map.values()].sort((a,b)=> a.key.localeCompare(b.key)).map(m => ({
    ...m,
    axis: YEAR==='all' ? m.key : MONTH_NAMES[+m.key.slice(5)-1],
    full: YEAR==='all' ? m.key : monthLabel(m.key),
  }));
}

function groupSum(pred, key){
  const map = new Map();
  for(const t of S.tx){ if(pred(t) && inYear(t)) map.set(t[key], (map.get(t[key])||0) + pesos(t)); }
  return [...map.entries()].sort((a,b)=> b[1]-a[1]);
}

function ageLabel(ts){
  if(!ts) return 'never';

  if(m<60) return m+'m ago';
  const h = Math.floor(m/60);
  if(h<24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

  if(performance.now() < 2600){ setTimeout(rerenderIfIdle, 2700 - performance.now()); return; }
  const ae = document.activeElement;

async function syncRates(){
  if(syncState==='syncing') return;
  syncState = 'syncing';
  updateSyncUI();
  const ids = [...new Set(Object.values(COIN_IDS))].join(',');
  const [fiat, crypto] = await Promise.allSettled([
    fetch('https://open.er-api.com/v6/latest/PHP').then(r=>r.json()),
    fetch('https://api.coingecko.com/api/v3/simple/price?ids='+ids+'&vs_currencies=php').then(r=>r.json()),
  ]);
  let updated = false;
  if(fiat.status==='fulfilled' && fiat.value?.result==='success'){
    const r = fiat.value.rates;
    S.fiatCache = r; // full PHP-based table, so any currency can be added later
    for(const code of Object.keys(S.rates)){
      if(code==='PHP' || code==='USDT') continue;       // USDT comes from CoinGecko
      if(r[code] > 0){ S.rates[code] = +(1/r[code]).toFixed(4); updated = true; }
    }
  }
  if(crypto.status==='fulfilled'){
    const phpOf = id => crypto.value?.[id]?.php;
    if(phpOf('tether') && 'USDT' in S.rates){ S.rates.USDT = +phpOf('tether').toFixed(4); updated = true; }
    for(const a of S.assets){
      const id = COIN_IDS[String(a.name||'').trim().toUpperCase()];
      if(id && phpOf(id)){ a.rate = +phpOf(id).toFixed(2); updated = true; }
    }
  }
  // persist() not save(): a live-rate refresh is not a user edit and must not
  // claim merge priority for this device's sections, nor trigger a cloud push
  if(updated){ S.lastSync = Date.now(); persist(); syncState = 'ok'; }
  else syncState = 'error';
  updateSyncUI();
  rerenderIfIdle();
}

const b64e = buf => { const a = new Uint8Array(buf); let s = '';
  for(let i=0; i<a.length; i+=0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i+0x8000));
  return btoa(s); };
const b64d = str => Uint8Array.from(atob(str), c => c.charCodeAt(0));

async function deriveKey(pass, salt){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' }, km,
    { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encState(obj, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt);
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({ v:1, s:b64e(salt), i:b64e(iv), c:b64e(ct) });
}
async function decState(str, pass){
  const p = JSON.parse(str);
  const key = await deriveKey(pass, b64d(p.s));
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64d(p.i) }, key, b64d(p.c));
  return JSON.parse(new TextDecoder().decode(pt));
}

async function gotrue(path, body){
  const r = await fetch(SYNC_URL+'/auth/v1/'+path, {
    method:'POST', headers:{ 'Content-Type':'application/json', apikey:SYNC_KEY },
    body: JSON.stringify(body) });

}
/* the account password is derived from the passphrase (Bitwarden-style):
   the server only ever sees this hash, so it can never decrypt the ledger */
async function deriveAuthPassword(email, pass){
  const salt = new TextEncoder().encode('aoi-auth-v1|' + email.trim().toLowerCase());
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' }, km, 256);
  return b64e(bits);
}

  sess.access = j.access_token; sess.refresh = j.refresh_token; sess.exp = (j.expires_at||0)*1000;
  saveSess();
  return sess.access;

/* per-transaction merge: newest edit wins by id, deletions win via tombstones,
   non-transaction sections follow whichever device saved most recently */
function mergeStates(local, remote){
  const newerIsRemote = (remote.metaU||0) > (local.metaU||0);
  const base = newerIsRemote ? remote : local;
  const other = newerIsRemote ? local : remote;
  const out = { ...base };
  // union the list sections so a fresh device's defaults can never erase real data
  out.clients = [...new Set([...(base.clients||[]), ...(other.clients||[])])];
  out.categories = [...new Set([...(base.categories||[]), ...(other.categories||[])])];
  const assetNames = new Set((base.assets||[]).map(a=>String(a.name).toUpperCase()));
  out.assets = [...(base.assets||[]), ...(other.assets||[]).filter(a=>!assetNames.has(String(a.name).toUpperCase()))];
  out.rates = { ...(other.rates||{}), ...(base.rates||{}) };
  const map = new Map();
  for(const t of [...(local.tx||[]), ...(remote.tx||[])]){
    const k = String(t.id), cur = map.get(k);
    if(!cur || (t.u||0) > (cur.u||0)) map.set(k, t);
  }
  const tomb = { ...(remote.deleted||{}), ...(local.deleted||{}) };
  for(const [id, ts] of Object.entries(tomb)){
    const t = map.get(id);
    if(t && ts >= (t.u||0)) map.delete(id);
  }
  out.tx = [...map.values()];
  out.deleted = tomb;
  out.nextId = Math.max(local.nextId||1, remote.nextId||1);
  return out;
}

let remoteSeen = 0, selfPushAt = 0;

async function cloudSync(force){
  if(!sess || syncBusy) return;
  if(!navigator.onLine && !force) return;
  syncBusy = true; cloudState = 'syncing'; refreshSyncUI();
  try{
    const rows = await rest('ledgers?select=data,updated_at');
    if(rows && rows[0]){
      remoteSeen = Date.parse(rows[0].updated_at) || 0;
      let remote = null;
      try{ remote = await decState(rows[0].data, sess.pass); }
      catch{ cloudState = 'badpass'; syncBusy = false; refreshSyncUI(); return; }
      S = mergeStates(S, remote);
      persist();
      rerenderIfIdle();
    }
    const cipher = await encState(S, sess.pass);
    await rest('ledgers', { method:'POST',
      headers:{ Prefer:'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify([{ user_id: sess.uid, data: cipher, updated_at: new Date().toISOString() }]) });
    selfPushAt = Date.now();
    remoteSeen = Date.now();
    sess.last = Date.now(); saveSess();
    cloudState = 'ok';
  }catch(e){ cloudState = 'error'; }
  syncBusy = false;
  refreshSyncUI();
  rtConnect(); // make sure the live channel is up whenever sync succeeds
}
function scheduleCloudPush(){
  if(!sess) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(()=>cloudSync(), 3000);
}

/* ---------- live updates: realtime websocket + polling fallback ----------
   Each device subscribes to its own ledger row; when another device pushes,
   the change arrives over the socket and triggers a pull within moments. */
let rtWs = null, rtRef = 0, rtHb = null, rtPullTimer = null, rtTokenAt = 0;

function rtConnect(){
  if(!sess || rtWs || !navigator.onLine) return;
  let ws;
  try{ ws = new WebSocket(SYNC_URL.replace('https://','wss://') + '/realtime/v1/websocket?apikey=' + SYNC_KEY + '&vsn=1.0.0'); }
  catch{ return; }
  rtWs = ws;
  ws.onopen = async () => {
    let tok = null;
    try{ tok = await freshToken(); }catch{}
    if(!tok || ws !== rtWs){ try{ ws.close(); }catch{} return; }
    rtTokenAt = Date.now();
    ws.send(JSON.stringify({ topic:'realtime:ledger', event:'phx_join', ref:String(++rtRef),
      payload:{ access_token: tok, config:{ postgres_changes:[
        { event:'*', schema:'public', table:'ledgers', filter:'user_id=eq.'+sess.uid }
      ]}}}));
    clearInterval(rtHb);
    rtHb = setInterval(async () => {
      if(ws !== rtWs || ws.readyState !== 1) return;
      try{ ws.send(JSON.stringify({ topic:'phoenix', event:'heartbeat', payload:{}, ref:String(++rtRef) })); }catch{}
      if(Date.now() - rtTokenAt > 15*60*1000){
        rtTokenAt = Date.now();
        try{ const t2 = await freshToken();
          ws.send(JSON.stringify({ topic:'realtime:ledger', event:'access_token', payload:{ access_token:t2 }, ref:String(++rtRef) }));
        }catch{}
      }
    }, 25000);
  };
  ws.onmessage = ev => {
    try{
      const m = JSON.parse(ev.data);
      if(m.event === 'postgres_changes'){
        if(Date.now() - selfPushAt < 2500) return; // that was our own push echoing back
        clearTimeout(rtPullTimer);
        rtPullTimer = setTimeout(()=>cloudSync(), 700);
      }
    }catch{}
  };
  ws.onclose = () => {
    if(ws !== rtWs) return;
    rtWs = null; clearInterval(rtHb);
    if(sess) setTimeout(rtConnect, 5000);
  };
  ws.onerror = () => { try{ ws.close(); }catch{} };
}

/* polling fallback: a featherweight timestamp check in case the socket is down */
async function cloudPeek(){
  if(!sess || syncBusy || !navigator.onLine || document.visibilityState!=='visible') return;
  try{
    const rows = await rest('ledgers?select=updated_at');
    const ts = rows?.[0]?.updated_at ? Date.parse(rows[0].updated_at) : 0;
    if(ts > remoteSeen + 1500) await cloudSync();
  }catch{}
}

/* graph entrance animations: play once per app load, when first seen */
const seenGraphs = new Set();
function animateGraphs(){
  document.querySelectorAll('[data-see]').forEach(el=>{
    const key = el.dataset.see;
    if(seenGraphs.has(key) || !('IntersectionObserver' in window)){
      el.classList.add('go'); seenGraphs.add(key); return;
    }
    const io = new IntersectionObserver(entries=>{
      for(const e of entries){
        if(e.isIntersecting){
          // double rAF: let the collapsed state paint first so the transition runs
          requestAnimationFrame(()=> requestAnimationFrame(()=> e.target.classList.add('go')));
          seenGraphs.add(key);
          io.disconnect();
        }
      }
    }, { threshold:.25 });
    io.observe(el);
  });
}

const tickPrev = {};
function tickNumbers(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-tick]').forEach(el=>{
    const target = parseFloat(el.dataset.tick) || 0;
    const from = tickPrev[el.dataset.key] ?? 0;
    tickPrev[el.dataset.key] = target;
    if(reduce || from===target){ el.textContent = php0(target); return; }
    const t0 = performance.now(), dur = 900;
    const frame = now => {
      const p = Math.min(1, (now-t0)/dur);
      const e = 1 - Math.pow(1-p, 4);
      el.textContent = php0(from + (target-from)*e);
      if(p<1) requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  });
}

/* Catmull-Rom → cubic bezier: smooth curve through every point */
function smoothPath(pts){
  if(pts.length === 1) return `M${pts[0][0]} ${pts[0][1]}`;
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=0; i<pts.length-1; i++){
    const p0 = pts[Math.max(0,i-1)], p1 = pts[i], p2 = pts[i+1], p3 = pts[Math.min(pts.length-1,i+2)];
    const c1x = p1[0]+(p2[0]-p0[0])/6, c2x = p2[0]-(p3[0]-p1[0])/6;
    // clamp control-point y within the segment's endpoints so the curve
    // never overshoots a real value (peaks stay exactly on the data)
    const lo = Math.min(p1[1], p2[1]), hi = Math.max(p1[1], p2[1]);
    const c1y = Math.min(hi, Math.max(lo, p1[1]+(p2[1]-p0[1])/6));
    const c2y = Math.min(hi, Math.max(lo, p2[1]-(p3[1]-p1[1])/6));
    d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}

function chartSVG(months){
  const W=960, H=270, padL=56, padR=8, padT=16, padB=26;
  const iw = W-padL-padR, ih = H-padT-padB;
  const baseY = padT + ih;

  // one point per month: the curve reacts to monthly totals, so it stays
  // aloft on recurring income instead of diving to the floor between payments
  const maxRaw = Math.max(1, ...months.map(m=>Math.max(m.received+m.incoming, m.expenses)));
  const step = maxRaw>200000 ? 50000 : 25000;
  const max = Math.ceil(maxRaw/step)*step;
  const y = v => padT + ih - (v/max)*ih;
  const n = months.length || 1;
  const slot = iw/n;

  let g = '';
  for(let v=0; v<=max; v+=step){
    g += `<line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="var(--line-soft)" stroke-width="1"/>` +
         `<text x="${padL-8}" y="${y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--faint)">${v? (v/1000)+'k' : '0'}</text>`;
  }

  const incPts = months.map((m,i)=>[padL + slot*i + slot/2, y(m.received + m.incoming)]);
  const expPts = months.map((m,i)=>[padL + slot*i + slot/2, y(m.expenses)]);

  let labels = '';
  months.forEach((m,i)=>{
    labels += `<text x="${padL + slot*i + slot/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${m.axis}</text>`;
  });

  const incLine = smoothPath(incPts);
  const expLine = smoothPath(expPts);
  const incArea = incPts.length>1
    ? `${incLine} L${incPts[incPts.length-1][0].toFixed(1)} ${baseY} L${incPts[0][0].toFixed(1)} ${baseY} Z` : '';

  const defs = `<defs>
    <pattern id="dotgrid" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="var(--income)" opacity=".45"/>
    </pattern>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="plot"><rect x="${padL}" y="0" width="${iw}" height="${baseY}"/></clipPath>
  </defs>`;

  const series = `
    <g clip-path="url(#plot)">
      ${incArea ? `<path class="ar" d="${incArea}" fill="url(#dotgrid)" stroke="none"/>` : ''}
      ${expPts.length>1 ? `<path class="lnglow" d="${expLine}" fill="none" stroke="var(--expense)" stroke-width="9" opacity=".3" filter="url(#bloom)"/>` : ''}
      ${incPts.length>1 ? `<path class="lnglow" d="${incLine}" fill="none" stroke="var(--income)" stroke-width="10" opacity=".4" filter="url(#bloom)"/>` : ''}
      ${expPts.length>1 ? `<path class="ln" pathLength="1" d="${expLine}" fill="none" stroke="var(--expense)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>` : ''}
      ${incPts.length>1 ? `<path class="ln" pathLength="1" d="${incLine}" fill="none" stroke="var(--income)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
      ${incPts.length===1 ? `<circle cx="${incPts[0][0]}" cy="${incPts[0][1]}" r="4" fill="var(--income)"/>` : ''}
    </g>`;

  const hits = months.map((m,i)=>
    `<rect data-month="${m.key}" data-label="${m.full}" data-rec="${m.received}" data-inc="${m.incoming}" data-exp="${m.expenses}" x="${(padL + slot*i).toFixed(1)}" y="${padT}" width="${slot.toFixed(1)}" height="${ih+padB}" fill="transparent" style="cursor:pointer"/>`).join('');

  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly cashflow">${defs}${g}${series}${labels}${hits}</svg>`;
}

/* ---------- transactions ---------- */

function txFiltered(){
  const q = F.q.trim().toLowerCase();
  return S.tx.filter(t =>
    inYear(t) &&
    (!F.type || t.type===F.type) &&
    (!F.status || t.status===F.status) &&
    (!F.category || t.category===F.category) &&
    (!F.client || t.client===F.client) &&
    (!F.month || t.date.startsWith(F.month)) &&
    (!q || (t.desc+' '+t.client+' '+t.category+' '+(t.notes||'')).toLowerCase().includes(q))

}

function viewTx(){

    <select id="f-category"><option value="">All categories</option>${opts(S.categories,F.category)}</select>

/* description autocomplete: surface past entries, prefill their details on pick */
let acItems = [];
function descSuggest(q){
  const ac = $('#ac'); if(!ac) return;
  q = q.trim().toLowerCase();
  if(!q){ ac.hidden = true; return; }
  const seen = new Map(); // most recent transaction per distinct description
  for(const t of S.tx){
    const k = t.desc.toLowerCase();
    const cur = seen.get(k);
    if(!cur || t.date > cur.date) seen.set(k, t);
  }
  const all = [...seen.values()];
  const byDate = (a,b)=> b.date.localeCompare(a.date);
  const starts = all.filter(t=>t.desc.toLowerCase().startsWith(q)).sort(byDate);
  const contains = all.filter(t=>!t.desc.toLowerCase().startsWith(q) && t.desc.toLowerCase().includes(q)).sort(byDate);
  acItems = [...starts, ...contains].slice(0,6);
  if(!acItems.length || (acItems.length===1 && acItems[0].desc.toLowerCase()===q)){ ac.hidden = true; return; }
  ac.innerHTML = acItems.map((t,i)=>
    `<div class="ac-item" data-ac="${i}"><span>${esc(t.desc)}</span><span class="m">${esc(t.category)}${t.client && t.client!=='N/A' ? ' · '+esc(t.client) : ''}</span></div>`).join('');
  ac.hidden = false;
}
function acPick(i){
  const t = acItems[i]; if(!t || !editing) return;
  pullPanel();
  editing.desc = t.desc;
  if(S.clients.includes(t.client)) editing.client = t.client;
  if(S.categories.includes(t.category)) editing.category = t.category;
  if(t.currency in S.rates){ editing.currency = t.currency; editing.rate = S.rates[t.currency] ?? t.rate; }
  haptic(6);
  renderPanel();
  setTimeout(()=> $('#e-amount')?.focus(), 60);
}

function failField(el){
  el.classList.add('err','shake');
  el.addEventListener('animationend', ()=>el.classList.remove('shake'), {once:true});
  el.addEventListener('input', ()=>el.classList.remove('err'), {once:true});
  haptic(20);
  el.focus();
}

async function saveTx(){
  pullPanel();
  const e = editing;
  if(!e.desc.trim()){ failField($('#e-desc')); return; }
  if(!(e.amount>0)){ failField($('#e-amount')); return; }
  const isNew = e.id===null;
  e.u = Date.now();
  let extra = '';

  if(isNew){
    e.id = genId();
    if(e.recurring){
      // spawn the rest of the year's occurrences up front
      e.sid = 's' + e.id;
      const [yy, mm, dd] = e.date.split('-').map(Number);
      const copies = [];
      for(let m = mm+1; m <= 12; m++){
        const maxD = new Date(yy, m, 0).getDate();
        copies.push({ ...e, id: genId(), u: Date.now(),
          date: `${yy}-${String(m).padStart(2,'0')}-${String(Math.min(dd,maxD)).padStart(2,'0')}`,
          status: e.type==='Income' ? 'Incoming' : 'Due' });
      }
      S.tx.push(e, ...copies);
      if(copies.length) extra = ` + ${copies.length} upcoming`;
    } else {
      S.tx.push(e);
    }
  } else {
    const orig = S.tx.find(t=>sameId(t.id, e.id));
    const members = orig ? seriesOf(orig) : [];
    if(members.length > 1){
      const sc = await askScope(`"${orig.desc}" repeats ${members.length} times. Apply changes to…`);
      if(sc==='cancel') return;
      if(sc==='all'){
        // shared fields propagate; each occurrence keeps its own date and status
        for(const t of members){
          if(sameId(t.id, e.id)) continue;
          Object.assign(t, { desc:e.desc, client:e.client, category:e.category,
            currency:e.currency, amount:e.amount, rate:e.rate,
            recurring:e.recurring, notes:e.notes, u:Date.now() });
        }
        extra = ` · all ${members.length}`;
      }
    }
    const i = S.tx.findIndex(t=>sameId(t.id, e.id));
    if(i>=0) S.tx[i] = e;
  }

  if(e.type==='Income'){ LASTUSE.incomeCat = e.category; LASTUSE.incomeClient = e.client; }
  else LASTUSE.expenseCat = e.category;

document.addEventListener('click', ev => {
  const sc = ev.target.closest('[data-scope]');
  if(sc || ev.target.id==='scopeask'){
    $('#scopeask').hidden = true;
    const r = scopeResolve; scopeResolve = null;
    if(r) r(sc ? sc.dataset.scope : 'cancel');
    return;
  }

  const go = ev.target.closest('[data-go]');
  if(go){
    if(route === go.dataset.go){ window.scrollTo({ top:0, behavior:'smooth' }); return; }
    route = go.dataset.go; render(true); return;
  }

  if(selectMode){
    const tr = ev.target.closest('tr[data-edit]');
    if(tr){
      const id = tr.dataset.edit;
      selected.has(id) ? selected.delete(id) : selected.add(id);
      tr.classList.toggle('selected', selected.has(id));
      updateBulkUI();
      haptic(6);
      return;
    }
  }

  const flip = ev.target.closest('[data-flip]');
  if(flip){ flipStatus(flip.dataset.flip); return; }

  const clear = ev.target.closest('[data-clear]');
  if(clear){ F[clear.dataset.clear] = ''; render(); return; }

  const bar = ev.target.closest('[data-month]');
  if(bar){
    const k = bar.dataset.month;
    if(k.length===4){ YEAR = k; try{ localStorage.setItem('aoi-year', k); }catch{} F.month = ''; }
    else F.month = k;
    route = 'tx'; render(true); return;
  }

  if(ev.target.closest('#toast button')){
    if(toastUndo){ toastUndo(); toastUndo = null; haptic(10); render(); }
    $('#toast').classList.remove('show');
    return;
  }

  const editRow = ev.target.closest('[data-edit]');
  if(editRow){ openPanel(editRow.dataset.edit); return; }

  const segBtn = ev.target.closest('#e-type button');
  if(segBtn && editing){
    pullPanel();
    const wasNew = editing.id===null;
    editing.type = segBtn.dataset.type;
    editing.status = statusChoices(editing.type)[editing.status==='Incoming'||editing.status==='Due' ? 1 : 0];
    if(wasNew){ const d = typeDefaults(editing.type); editing.client = d.client; editing.category = d.category; }
    haptic(8);
    renderPanel(); return;
  }

  const delAsset = ev.target.closest('[data-del-asset]');
  if(delAsset){
    const i = +delAsset.dataset.delAsset;
    const [gone] = S.assets.splice(i,1);
    save(); render();
    showToast(`Removed ${gone.name}`, ()=>{ S.assets.splice(Math.min(i,S.assets.length),0,gone); save(); });
    return; }

  const delRate = ev.target.closest('[data-del-rate]');
  if(delRate){ delete S.rates[delRate.dataset.delRate]; save(); render(); return; }
  const frcDel = ev.target.closest('[data-frc-del]');
  if(frcDel){
    frClients.splice(+frcDel.dataset.frcDel, 1);
    $('#frc-list').innerHTML = frClients.map((c,i)=>
      `<span class="tag">${esc(c)}<button data-frc-del="${i}" aria-label="Remove ${esc(c)}">×</button></span>`).join('');
    return;
  }

  const delClient = ev.target.closest('[data-del-client]');
  if(delClient){ S.clients.splice(+delClient.dataset.delClient,1); save(); render(); return; }
  const delCat = ev.target.closest('[data-del-cat]');
  if(delCat){ S.categories.splice(+delCat.dataset.delCat,1); save(); render(); return; }

  const act = ev.target.closest('[data-act]')?.dataset.act;
  if(!act) return;
  switch(act){
    case 'sync': syncRates(); break;
    case 'select-mode': selectMode ? exitSelect() : enterSelect(); break;
    case 'bulk-all':
      txFiltered().forEach(t=>selected.add(String(t.id)));
      updateBulkUI(); render(); break;
    case 'bulk-confirm': bulkApply(selected.size+' marked received / paid', t=>{ t.status = t.type==='Income'?'Received':'Paid'; }); break;
    case 'bulk-pending': bulkApply(selected.size+' marked incoming / due', t=>{ t.status = t.type==='Income'?'Incoming':'Due'; }); break;
    case 'bulk-delete': bulkDelete(); break;
    case 'sync-go': {
      const em = $('#sy-email')?.value.trim(), pass = $('#sy-pass')?.value || '';
      if(!em || !em.includes('@')){ failField($('#sy-email')); break; }
      if(pass.length < 6){ failField($('#sy-pass')); break; }
      showToast('Connecting…');
      syncSignIn(em, pass)
        .then(()=>{ render(); showToast('Sync enabled on this device'); })
        .catch(err=>showToast(err.message));
      break; }
    case 'sync-now': cloudSync(true); break;
    case 'sync-off':
      if(confirm('Stop syncing on this device? Your local data stays.')){
        sess = null; saveSess(); cloudState = 'idle';
        try{ rtWs?.close(); }catch{} rtWs = null; clearInterval(rtHb);
        render();
      } break;
    case 'fr-fresh':
      $('#fr-choice').hidden = true;
      $('#fr-clients').hidden = false;
      setTimeout(()=> $('#frc-input')?.focus(), 150);
      break;
    case 'fr-cl-add': frClientAdd(); break;
    case 'fr-cl-done': {
      frClientAdd(); // capture anything still typed in the box
      const s = buildFresh();
      if(frClients.length) s.clients = [...frClients, 'N/A'];
      adoptState(s, frClients.length
        ? `Fresh start · ${frClients.length} client${frClients.length===1?'':'s'} ready`
        : 'Fresh start. Add your first transaction!');
      break; }
    case 'fr-cl-skip':
      adoptState(buildFresh(), 'Fresh start. Add your first transaction!');
      break;
    case 'fr-sample': adoptState(buildSample(), 'Sample data loaded. Explore freely!'); break;
    case 'fr-import': $('#importFile').click(); break;
    case 'add': openPanel(null); break;
    case 'close': closePanel(); break;
    case 'save-tx': saveTx(); break;
    case 'privacy':
      privacy = !privacy;
      try{ localStorage.setItem('aoi-privacy', privacy?'1':'0'); }catch{}
      haptic(8);
      applyPrivacy(); break;
    case 'm-prev': stepMonth(-1); break;
    case 'm-next': stepMonth(1); break;
    case 'y-prev': stepYear(-1); break;
    case 'y-next': stepYear(1); break;
    case 'delete':
      if(editing?.id!=null){ const id = editing.id; closePanel(); deleteTx(id); }
      break;
    case 'add-asset': S.assets.push({name:'NEW', qty:0, rate:1}); save(); render(); break;
    case 'add-cur': {
      const code = $('#new-cur').value.trim().toUpperCase();
      const rate = parseFloat($('#new-cur-rate').value);
      if(code && rate>0 && !S.rates[code]){ S.rates[code]=rate; save(); render(); }
      break; }
    case 'add-client': {
      const v = $('#new-client').value.trim();
      if(v && !S.clients.includes(v)){ S.clients.push(v); save(); render(); } break; }
    case 'add-cat': {
      const v = $('#new-cat').value.trim();
      if(v && !S.categories.includes(v)){ S.categories.push(v); save(); render(); } break; }
    case 'export': {
      const blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'aoi-backup-' + todayISO() + '.json';
      a.click(); URL.revokeObjectURL(a.href);
      S.lastBackup = Date.now(); save(); render(); break; }
    case 'import': $('#importFile').click(); break;
    case 'reset':
      if(confirm('Erase ALL data on this device? Export a backup first if you want to keep anything.')){
        try{ localStorage.removeItem(KEY); localStorage.removeItem('kita-state-v1'); }catch{}
        location.reload();
      } break;
  }
});

/* swipe on transaction rows — Apple Mail feel:
   1:1 tracking up to the action width, rubber-band beyond it,
   commit color flip at the threshold, spring-back or slide-out on release */
let sw = null;
const SW_COMMIT = 96, SW_MAX = 156;

function swSet(tr, dx){
  tr.style.setProperty('--dx', dx.toFixed(1)+'px');
  tr.style.setProperty('--adx', Math.abs(dx).toFixed(1)+'px');
}
function swCleanup(tr){
  tr.style.removeProperty('--dx');
  tr.style.removeProperty('--adx');
  tr.classList.remove('swipe-r','swipe-l','commit');
}
function swTween(tr, from, to, ms, ease, done){
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now-t0)/ms);
    swSet(tr, from + (to-from)*ease(p));
    if(p < 1) requestAnimationFrame(step);
    else done && done();
  };
  requestAnimationFrame(step);
}
const easeOutBack = p => { const c = 1.3; return 1 + (c+1)*Math.pow(p-1,3) + c*Math.pow(p-1,2); };
const easeInQuad = p => p*p;

document.addEventListener('touchstart', ev => {
  const tr = ev.target.closest('.tx-table tbody tr[data-edit]');
  if(!tr || editing || selectMode) return;
  sw = { tr, id:tr.dataset.edit, x:ev.touches[0].clientX, y:ev.touches[0].clientY,
         dx:0, active:false, committed:false };
}, {passive:true});

document.addEventListener('touchmove', ev => {
  if(!sw) return;
  const raw = ev.touches[0].clientX - sw.x, dy = ev.touches[0].clientY - sw.y;
  if(!sw.active){
    if(Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(raw)){ sw = null; return; }
    if(Math.abs(raw) > 10) sw.active = true;
  }
  if(!sw.active) return;
  const abs = Math.abs(raw);
  const eased = abs <= SW_COMMIT ? abs : SW_COMMIT + (abs - SW_COMMIT) * 0.32;
  const dx = Math.sign(raw) * Math.min(SW_MAX, eased);
  sw.dx = dx;
  swSet(sw.tr, dx);
  sw.tr.classList.toggle('swipe-r', dx > 6);
  sw.tr.classList.toggle('swipe-l', dx < -6);
  const committed = Math.abs(dx) >= SW_COMMIT - 2;
  if(committed !== sw.committed){
    sw.committed = committed;
    sw.tr.classList.toggle('commit', committed);
    haptic(8);
  }
}, {passive:true});

document.addEventListener('touchend', () => {
  if(!sw) return;
  const { tr, dx, id, active } = sw; sw = null;
  if(!active) return;
  if(dx <= -(SW_COMMIT - 2)){
    // recurring series: snap back and ask scope instead of sliding out
    const t = S.tx.find(x=>sameId(x.id, id));
    if(t && seriesOf(t).length > 1){
      swTween(tr, dx, 0, 260, easeOutBack, () => { swCleanup(tr); deleteTx(id); });
      return;
    }
    // accelerate off-screen, collapse the row's height, then delete
    swTween(tr, dx, -(tr.offsetWidth + 24), 190, easeInQuad, () => {
      tr.style.height = tr.offsetHeight + 'px';
      tr.style.transition = 'height .16s ease-out, padding .16s ease-out, border-color .16s ease-out';
      void tr.offsetHeight;
      tr.style.height = '0px';
      tr.style.paddingTop = '0';
      tr.style.paddingBottom = '0';
      tr.style.borderColor = 'transparent';
      setTimeout(() => deleteTx(id), 170);
    });
  } else if(dx >= SW_COMMIT - 2){
    swTween(tr, dx, 0, 340, easeOutBack, () => { swCleanup(tr); flipStatus(id); });
  } else {
    swTween(tr, dx, 0, 300, easeOutBack, () => swCleanup(tr));
  }
});
